<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Настройки бэкенда</title>
<style>
  :root { color-scheme: dark; --bg: #09090a; --fg: #f4f4f2; --muted: #9a9a94; --line: #26262a; --accent: #e8ff5a; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, "Segoe UI", sans-serif; }
  form { display: grid; gap: 14px; padding: 24px; }
  h1 { margin: 0; font-size: 18px; }
  p { margin: 0; color: var(--muted); }
  label { display: grid; gap: 6px; font-weight: 600; }
  input[type=text], input[type=password] { background: #141416; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font: inherit; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 8px; align-items: center; font-weight: 400; }
  .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
  button { justify-self: start; background: var(--accent); color: #11140a; border: 0; border-radius: 8px; padding: 10px 18px; font: 600 14px system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<form id="f">
  <h1>Бэкенд Freefield</h1>
  <p>Генерация идёт на GPU: в облаке Modal или на вашем ComfyUI. Укажите адрес шлюза и токен из инструкции Freefield.</p>
  <label for="COMFY_BASE_URL">Адрес бэкенда (COMFY_BASE_URL)
    <input type="text" id="COMFY_BASE_URL" placeholder="https://ВАШ-WORKSPACE--freefield-serve.modal.run или http://127.0.0.1:8000">
  </label>
  <label for="FREEFIELD_TOKEN">Токен шлюза (FREEFIELD_TOKEN)
    <input type="password" id="FREEFIELD_TOKEN" autocomplete="off">
    <span class="hint">Создаётся командой python tools/setup_token.py</span>
  </label>
  <label class="row"><input type="checkbox" id="FREEFIELD_DRAFTS"> Показывать черновые приложения (ещё не запускались на GPU)</label>
  <button type="submit">Сохранить и перезапустить</button>
</form>
<script>
  const f = document.getElementById('f');
  window.settings.get().then((v) => {
    f.COMFY_BASE_URL.value = v.COMFY_BASE_URL || '';
    f.FREEFIELD_TOKEN.value = v.FREEFIELD_TOKEN || '';
    f.FREEFIELD_DRAFTS.checked = v.FREEFIELD_DRAFTS === '1';
  });
  f.addEventListener('submit', (e) => {
    e.preventDefault();
    window.settings.save({ COMFY_BASE_URL: f.COMFY_BASE_URL.value, FREEFIELD_TOKEN: f.FREEFIELD_TOKEN.value, FREEFIELD_DRAFTS: f.FREEFIELD_DRAFTS.checked ? '1' : '' });
  });
</script>
</body>
</html>
